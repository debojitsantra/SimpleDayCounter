name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "SimpleDayCounter.csproj"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish framework-dependent single exe
        run: >
          dotnet publish ${{ env.PROJECT_PATH }} -c Release
          -r win-x64 --no-restore
          -p:SelfContained=false
          -o publish/framework-dependent

      - name: Publish self-contained single exe
        run: >
          dotnet publish ${{ env.PROJECT_PATH }} -c Release
          -r win-x64 --no-restore
          -p:SelfContained=true
          -o publish/self-contained

      - name: Upload framework-dependent build
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDayCounter-win-x64-framework-dependent
          path: publish/framework-dependent/SimpleDayCounter.exe
          if-no-files-found: error

      - name: Upload self-contained build
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDayCounter-win-x64-self-contained
          path: publish/self-contained/SimpleDayCounter.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download framework-dependent build
        uses: actions/download-artifact@v4
        with:
          name: SimpleDayCounter-win-x64-framework-dependent
          path: artifacts/framework-dependent

      - name: Download self-contained build
        uses: actions/download-artifact@v4
        with:
          name: SimpleDayCounter-win-x64-self-contained
          path: artifacts/self-contained

      - name: Rename artifacts for clarity
        run: |
          mv artifacts/framework-dependent/SimpleDayCounter.exe artifacts/SimpleDayCounter-framework-dependent.exe
          mv artifacts/self-contained/SimpleDayCounter.exe artifacts/SimpleDayCounter-self-contained.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SimpleDayCounter-framework-dependent.exe
            artifacts/SimpleDayCounter-self-contained.exe
          generate_release_notes: true
